<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Customer Support Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .chat-container { width: 100%; max-width: 650px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; height: 85vh; overflow: hidden; }
    .header { background: #2563eb; color: #fff; padding: 16px 20px; font-size: 1.1rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .header span { font-size: 0.85rem; opacity: 0.85; font-weight: normal; }
    .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: #f8fafc; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 14px; line-height: 1.5; font-size: 0.95rem; word-break: break-word; }
    .user-msg { background: #2563eb; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
    .bot-msg { background: #e2e8f0; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 2px; white-space: pre-wrap; }
    .input-bar { display: flex; gap: 10px; padding: 14px 18px; background: #fff; border-top: 1px solid #e2e8f0; }
    .input-bar input { flex: 1; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 24px; font-size: 0.95rem; outline: none; }
    .input-bar input:focus { border-color: #2563eb; }
    .input-bar button { background: #2563eb; color: #fff; border: none; padding: 0 20px; border-radius: 24px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .input-bar button:hover { background: #1d4ed8; }
    .input-bar button:disabled { background: #94a3b8; cursor: not-allowed; }
    .chips { display: flex; gap: 8px; padding: 10px 18px; background: #fff; border-top: 1px solid #f1f5f9; overflow-x: auto; }
    .chip { font-size: 0.8rem; background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; padding: 6px 12px; border-radius: 16px; cursor: pointer; white-space: nowrap; }
    .chip:hover { background: #dbeafe; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <div>AI Customer Support Agent</div>
      <span>Port: 8081</span>
    </div>

    <div class="messages" id="messages">
      <div class="msg bot-msg">👋 Hello! I am your AI Customer Support Assistant. How can I help you today? You can ask me about orders, returns, warranty, or delivery status.</div>
    </div>

    <div class="chips">
      <button class="chip" onclick="sendQuick('My order #1025 has not arrived. Can you check its status?')">📦 Check Order #1025</button>
      <button class="chip" onclick="sendQuick('Order 1026 arrived 6 days ago. Can I still return the watch?')">🔄 Return Order #1026</button>
      <button class="chip" onclick="sendQuick('Do you have the USB-C charger in stock?')">⚡ Check Stock</button>
    </div>

    <form class="input-bar" id="chatForm" onsubmit="handleSubmit(event)">
      <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off" />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script>
    let conversationId = null;
    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function appendMessage(text, isUser) {
      const msg = document.createElement('div');
      msg.className = 'msg ' + (isUser ? 'user-msg' : 'bot-msg');
      msg.textContent = text;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendQuick(text) {
      userInput.value = text;
      await sendMessage(text);
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;
      await sendMessage(text);
    }

    async function sendMessage(text) {
      appendMessage(text, true);
      userInput.value = '';
      sendBtn.disabled = true;

      const loadingMsg = document.createElement('div');
      loadingMsg.className = 'msg bot-msg';
      loadingMsg.textContent = 'Thinking...';
      messagesDiv.appendChild(loadingMsg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      try {
        const payload = { message: text };
        if (conversationId) payload.conversationId = conversationId;

        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        loadingMsg.remove();

        if (data.reply) {
          conversationId = data.conversationId;
          appendMessage(data.reply, false);
        } else {
          appendMessage("Error: Could not retrieve a response.", false);
        }
      } catch (err) {
        loadingMsg.remove();
        appendMessage("Network error: " + err.message, false);
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }
  </script>
</body>
</html>
