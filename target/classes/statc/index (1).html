<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3f5f9;
    --card: #ffffff;
    --ink: #121a2e;
    --muted: #5b6477;
    --line: #d9deea;
    --carrier: #1f4fd8;
    --carrier-dark: #173aa3;
    --tape: #ffb81c;
    --danger: #b42318;
    --radius: 14px;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0e1424;
      --card: #172037;
      --ink: #eef1f8;
      --muted: #98a2b8;
      --line: #2a3553;
      --carrier: #6d8cff;
      --carrier-dark: #8fa6ff;
      --danger: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.55 var(--body);
  }
  .app {
    display: grid;
    grid-template-columns: 330px minmax(0, 1fr);
    height: 100vh;
    height: 100dvh;
    max-width: 1180px;
    margin: 0 auto;
  }

  /* Left: what to try */
  aside {
    padding: 28px 24px;
    overflow-y: auto;
    border-right: 1px solid var(--line);
  }
  h1 {
    font: 700 1.7rem/1.1 var(--display);
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  .lede { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  h2 { font: 700 1rem/1.3 var(--display); margin: 0 0 10px; }

  /* Each sample order looks like a parcel label: dashed cut line, tape stripe on the left */
  .label {
    position: relative;
    width: 100%;
    text-align: left;
    background: var(--card);
    color: inherit;
    border: 1.5px dashed var(--line);
    border-left: 8px solid var(--tape);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    font: inherit;
    transition: border-color .15s, transform .15s;
  }
  .label:hover { border-color: var(--carrier); }
  .label:hover { border-left-color: var(--tape); }
  .label:active { transform: translateY(1px); }
  .label strong { display: block; font: 700 1.05rem/1.2 var(--display); }
  .label span { display: block; color: var(--muted); font-size: .88rem; margin-top: 2px; }
  .label em { font-style: normal; font-weight: 600; font-size: .88rem; display: block; margin-top: 6px; }

  .reset {
    margin-top: 8px;
    background: none;
    border: 0;
    color: var(--carrier);
    font: 600 .95rem var(--body);
    cursor: pointer;
    padding: 6px 0;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* Right: chat */
  main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 28px 28px 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty {
    margin: auto;
    max-width: 30ch;
    text-align: center;
    color: var(--muted);
  }
  .empty b { display: block; color: var(--ink); font: 700 1.25rem/1.25 var(--display); margin-bottom: 6px; }

  .msg { max-width: min(62ch, 88%); padding: 11px 15px; border-radius: var(--radius); overflow-wrap: anywhere; }
  .msg p { margin: 0 0 .6em; }
  .msg p:last-child { margin-bottom: 0; }
  .msg ul { margin: .3em 0 .6em 1.1em; padding: 0; }
  .me { align-self: flex-end; background: var(--carrier); color: #fff; border-bottom-right-radius: 4px; }
  @media (prefers-color-scheme: dark) { .me { color: #0e1424; } }
  .bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .err { align-self: flex-start; border: 1px solid var(--danger); color: var(--danger); background: transparent; border-radius: var(--radius); }

  .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  form {
    display: flex;
    gap: 10px;
    padding: 14px 28px 22px;
  }
  textarea {
    flex: 1;
    resize: none;
    max-height: 140px;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    color: var(--ink);
    font: inherit;
  }
  textarea::placeholder { color: var(--muted); }
  button.send {
    padding: 0 22px;
    border: 0;
    border-radius: var(--radius);
    background: var(--carrier);
    color: #fff;
    font: 600 1rem var(--body);
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button.send { color: #0e1424; } }
  button.send:hover { background: var(--carrier-dark); }
  button.send:disabled { opacity: .55; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--tape); outline-offset: 2px; }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; padding: 18px 16px; }
    .thread { padding: 18px 16px 8px; }
    form { padding: 10px 16px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Support chat</h1>
    <p class="lede">Ask about an order, a refund or a product. Tap a sample order to send its question.</p>

    <h2>Sample orders</h2>
    <button class="label" data-q="My order #1025 has not arrived. Can you check its status?">
      <strong>Order 1025</strong><span>Wireless Headphones X1</span><em>Running late</em>
    </button>
    <button class="label" data-q="Order 1026 arrived 6 days ago. Can I still return the watch?">
      <strong>Order 1026</strong><span>Smart Watch S2</span><em>Delivered 6 days ago</em>
    </button>
    <button class="label" data-q="When will order 1027 get to me?">
      <strong>Order 1027</strong><span>USB-C Fast Charger 65W</span><em>On its way</em>
    </button>
    <button class="label" data-q="Do you have the USB-C charger in stock, and what warranty does it have?">
      <strong>Product question</strong><span>Stock and warranty</span>
    </button>
    <button class="label" data-q="This is the third time I'm asking. I want to talk to a person about order 1025.">
      <strong>Ask for a person</strong><span>Creates a support ticket</span>
    </button>

    <button class="reset" id="reset" type="button">Start a new conversation</button>
  </aside>

  <main>
    <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation"></div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Type your question" aria-label="Your message" required></textarea>
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </main>
</div>

<script>
(function () {
  var thread = document.getElementById('thread');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var conversationId = null;

  function showEmpty() {
    thread.innerHTML = '<div class="empty" id="empty"><b>How can we help?</b>Ask about an order number, a refund, or a product.</div>';
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Small, safe markdown subset: **bold**, "- " lists, paragraphs
  function render(text) {
    var lines = escapeHtml(text).split(/\n/);
    var html = '', inList = false, para = [];
    function flush() { if (para.length) { html += '<p>' + para.join('<br>') + '</p>'; para = []; } }
    lines.forEach(function (line) {
      var item = line.match(/^\s*[-*]\s+(.*)$/);
      if (item) {
        flush();
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + item[1] + '</li>';
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        if (line.trim() === '') flush(); else para.push(line);
      }
    });
    if (inList) html += '</ul>';
    flush();
    return html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  function add(kind, content, asHtml) {
    var empty = document.getElementById('empty');
    if (empty) empty.remove();
    var div = document.createElement('div');
    div.className = 'msg ' + kind;
    if (asHtml) div.innerHTML = content; else div.textContent = content;
    thread.appendChild(div);
    thread.scrollTop = thread.scrollHeight;
    return div;
  }

  async function ask(text) {
    add('me', text, false);
    var typing = add('bot', '<span class="typing" aria-label="Agent is typing"><i></i><i></i><i></i></span>', true);
    sendBtn.disabled = true;
    try {
      var res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, conversationId: conversationId })
      });
      if (!res.ok) throw new Error('Server returned ' + res.status);
      var data = await res.json();
      conversationId = data.conversationId;
      typing.innerHTML = render(data.reply || '');
    } catch (e) {
      typing.className = 'msg err';
      typing.textContent = 'Message not sent. Check that the server and MongoDB are running and your API key is set, then try again. (' + e.message + ')';
    } finally {
      sendBtn.disabled = false;
      thread.scrollTop = thread.scrollHeight;
      input.focus();
    }
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = '';
    input.style.height = 'auto';
    ask(text);
  });

  input.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  document.querySelectorAll('.label').forEach(function (b) {
    b.addEventListener('click', function () { if (!sendBtn.disabled) ask(b.getAttribute('data-q')); });
  });

  document.getElementById('reset').addEventListener('click', function () {
    conversationId = null;
    showEmpty();
    input.focus();
  });

  showEmpty();
})();
</script>
</body>
</html>
